<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yeketema Bingo</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            margin: 0;
            padding: 16px;
        }

        .card-header {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .drawn-container {
            background: #1e293b;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        #drawn-box {
            font-size: 2.8rem;
            color: #38bdf8;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-width: 340px;
            margin: 0 auto 20px auto;
        }

        .cell {
            background: #1e293b;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 1px solid #334155;
        }

        .cell.marked {
            background: #22c55e;
            border-color: #4ade80;
            color: #052e16;
        }

        .cell.star {
            background: #eab308;
            border-color: #fde047;
            color: #422006;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            border-radius: 10px;
            width: 100%;
            max-width: 340px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="card-header">
        🎲 Yeketema Bingo
    </div>

    <div class="drawn-container">

        <small style="color: #94a3b8;">
            CURRENT NUMBER
        </small>

        <div id="drawn-box">
            --
        </div>

    </div>


    <div class="grid" id="bingo-grid"></div>


    <button onclick="claimBingo()">
        Claim Bingo! 🏆
    </button>


    <script>

        // =====================================
        // TELEGRAM
        // =====================================

        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.expand();
        }


        // =====================================
        // CONNECT TO RENDER
        // =====================================

        const socket = io(
            "https://bingo-backend-7rt0.onrender.com"
        );


        // =====================================
        // PLAYER CARD
        // =====================================

        let myCard = [];


        // =====================================
        // RECEIVE SERVER-GENERATED CARTELA
        // =====================================

        socket.on("your_card", (data) => {

            console.log("My cartela:", data.card);

            myCard = data.card;

            renderGrid();

        });


        // =====================================
        // DRAWN NUMBER
        // =====================================

        socket.on("number_drawn", (data) => {

            const number = data.number;

            document.getElementById("drawn-box").innerText =
                number < 10
                    ? "0" + number
                    : number;


            markNumber(number);

        });


        // =====================================
        // INITIAL GAME STATE
        // =====================================

        socket.on("init_state", (data) => {

            console.log(
                "Previous numbers:",
                data.drawnNumbers
            );


            // If numbers were already called
            // before this player joined,
            // mark them on the cartela.

            if (myCard.length > 0) {

                data.drawnNumbers.forEach(number => {

                    markNumber(number);

                });

            }


            // Display most recent number

            if (data.drawnNumbers.length > 0) {

                const lastNumber =
                    data.drawnNumbers[
                        data.drawnNumbers.length - 1
                    ];

                document.getElementById(
                    "drawn-box"
                ).innerText =
                    lastNumber < 10
                        ? "0" + lastNumber
                        : lastNumber;

            }

        });


        // =====================================
        // MARK NUMBER ON CARTELA
        // =====================================

        function markNumber(number) {

            const cell =
                document.getElementById(
                    `cell-${number}`
                );

            if (cell) {

                cell.classList.add("marked");

            }

        }


        // =====================================
        // DISPLAY CARTELA
        // =====================================

        function renderGrid() {

            const gridEl =
                document.getElementById(
                    "bingo-grid"
                );


            gridEl.innerHTML = "";


            // Server sends a 5 × 5 array.
            // Example:
            //
            // [
            //   [1, 20, 33, 48, 70],
            //   [5, 22, 35, 50, 72],
            //   ...
            // ]


            for (
                let row = 0;
                row < 5;
                row++
            ) {

                for (
                    let col = 0;
                    col < 5;
                    col++
                ) {

                    const number =
                        myCard[row][col];


                    const cell =
                        document.createElement(
                            "div"
                        );


                    // FREE SPACE

                    if (number === 0) {

                        cell.className =
                            "cell star marked";

                        cell.innerText = "★";

                    }

                    // NORMAL NUMBER

                    else {

                        cell.className =
                            "cell";

                        cell.innerText =
                            number < 10
                                ? "0" + number
                                : number;

                        cell.id =
                            `cell-${number}`;

                    }


                    gridEl.appendChild(cell);

                }

            }

        }


        // =====================================
        // GAME STARTED
        // =====================================

        socket.on("game_started", () => {

            console.log(
                "🎱 Bingo game started!"
            );

        });


        // =====================================
        // GAME FINISHED
        // =====================================

        socket.on("game_finished", () => {

            alert(
                "🎱 All 75 numbers have been called."
            );

        });


        // =====================================
        // BINGO RESULT
        // =====================================

        socket.on("game_over", (data) => {

            if (data.winner === socket.id) {

                if (data.fullCard) {

                    alert(
                        "🏆 BINGO!\n\n" +
                        "🎁 FULL CARTELA BONUS!"
                    );

                }

                else {

                    alert(
                        "🏆 BINGO!\n\n" +
                        "You completed 2 lines!"
                    );

                }

            }

            else {

                alert(
                    "🏆 GAME OVER!\n\n" +
                    "Another player won."
                );

            }

        });


        // =====================================
        // FALSE BINGO
        // =====================================

        socket.on("false_alarm", (data) => {

            alert(
                data.message
            );

        });


        // =====================================
        // CLAIM BINGO
        // =====================================

        function claimBingo() {

            // We DO NOT send the cartela.
            //
            // The server already knows
            // which cartela belongs to us.

            socket.emit(
                "claim_bingo"
            );

        }

    </script>

</body>
    </html>
