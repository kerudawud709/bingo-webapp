<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeketema Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: white; text-align: center; margin: 0; padding: 16px; }
        .card-header { font-size: 1.2rem; font-weight: bold; margin-bottom: 12px; }
        .drawn-container { background: #1e293b; padding: 12px; border-radius: 12px; margin-bottom: 16px; }
        #drawn-box { font-size: 2.8rem; color: #38bdf8; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 340px; margin: 0 auto 20px auto; }
        .cell { background: #1e293b; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-weight: bold; font-size: 1.1rem; border: 1px solid #334155; }
        .cell.marked { background: #22c55e; border-color: #4ade80; color: #052e16; }
        .cell.star { background: #eab308; border-color: #fde047; color: #422006; }
        button { background: #2563eb; color: white; border: none; padding: 14px; font-size: 1.1rem; border-radius: 10px; width: 100%; max-width: 340px; font-weight: bold; cursor: pointer; }
        button:active { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="card-header">🎲 Yeketema Bingo</div>
    <div class="drawn-container">
        <small style="color: #94a3b8;">CURRENT NUMBER</small>
        <div id="drawn-box">--</div>
    </div>

    <div class="grid" id="bingo-grid"></div>

    <button onclick="claimBingo()">Claim Bingo! 🏆</button>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        // Connect to your Render backend server
        // Replace the URL below with your actual Render URL once backend is live
        const socket = io("https://your-render-app-name.onrender.com");

        let myCard = generateBingoCard();

        function generateBingoCard() {
            const cols = [
                getRandomNums(1, 15, 5),
                getRandomNums(16, 30, 5),
                getRandomNums(31, 45, 5),
                getRandomNums(46, 60, 5),
                getRandomNums(61, 75, 5)
            ];
            cols[2][2] = 0; // Free Space in middle
            
            let card = [];
            for(let row = 0; row < 5; row++) {
                for(let col = 0; col < 5; col++) {
                    card.push(cols[col][row]);
                }
            }
            return card;
        }

        function getRandomNums(min, max, count) {
            let nums = [];
            while(nums.length < count) {
                let r = Math.floor(Math.random() * (max - min + 1)) + min;
                if(!nums.includes(r)) nums.push(r);
            }
            return nums;
        }

        function renderGrid() {
            const gridEl = document.getElementById("bingo-grid");
            gridEl.innerHTML = "";
            myCard.forEach((num) => {
                const cell = document.createElement("div");
                cell.className = "cell" + (num === 0 ? " star" : "");
                cell.innerText = num === 0 ? "★" : (num < 10 ? "0" + num : num);
                cell.id = `cell-${num}`;
                gridEl.appendChild(cell);
            });
        }

        socket.on("number_drawn", (data) => {
            document.getElementById("drawn-box").innerText = data.number < 10 ? "0" + data.number : data.number;
            const targetCell = document.getElementById(`cell-${data.number}`);
            if (targetCell) {
                targetCell.classList.add("marked");
            }
        });

        socket.on("game_over", (data) => {
            alert("🎉 Bingo! Winner: " + data.winner);
        });

        socket.on("false_alarm", (data) => {
            alert(data.message);
        });

        function claimBingo() {
            socket.emit("claim_bingo", myCard);
        }

        renderGrid();
    </script>
</body>
</html>
