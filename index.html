<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Yeketema Bingo</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>


    <style>

        body {

            font-family:
                system-ui,
                -apple-system,
                sans-serif;

            background: #0f172a;

            color: white;

            text-align: center;

            margin: 0;

            padding: 16px;

        }


        .title {

            font-size: 1.4rem;

            font-weight: bold;

            margin-bottom: 18px;

        }


        /* ==========================
           CARTELA SELECTION
           ========================== */

        #cartela-screen {

            display: block;

        }


        .selection-title {

            font-size: 1.1rem;

            margin-bottom: 15px;

        }


        .cartela-grid {

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 8px;

            max-width: 360px;

            margin: 0 auto;

        }


        .cartela-button {

            background: #1e293b;

            color: white;

            border: 1px solid #334155;

            border-radius: 9px;

            padding: 14px 5px;

            font-size: 1rem;

            font-weight: bold;

            cursor: pointer;

        }


        .cartela-button:active {

            background: #2563eb;

        }


        .cartela-button.unavailable {

            background: #334155;

            color: #64748b;

            text-decoration: line-through;

            cursor: not-allowed;

        }


        /* ==========================
           BINGO SCREEN
           ========================== */

        #game-screen {

            display: none;

        }


        .card-number {

            font-size: 1rem;

            font-weight: bold;

            margin-bottom: 12px;

        }


        .drawn-container {

            background: #1e293b;

            padding: 12px;

            border-radius: 12px;

            margin-bottom: 16px;

        }


        #drawn-box {

            font-size: 2.8rem;

            color: #38bdf8;

            font-weight: bold;

        }


        .grid {

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 8px;

            max-width: 340px;

            margin: 0 auto 20px auto;

        }


        .cell {

            background: #1e293b;

            aspect-ratio: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 8px;

            font-weight: bold;

            font-size: 1.1rem;

            border: 1px solid #334155;

        }


        .cell.marked {

            background: #22c55e;

            border-color: #4ade80;

            color: #052e16;

        }


        .cell.star {

            background: #eab308;

            border-color: #fde047;

            color: #422006;

        }


        .claim-button {

            background: #2563eb;

            color: white;

            border: none;

            padding: 14px;

            font-size: 1.1rem;

            border-radius: 10px;

            width: 100%;

            max-width: 340px;

            font-weight: bold;

            cursor: pointer;

        }


        .back-button {

            background: #475569;

            color: white;

            border: none;

            padding: 10px 16px;

            border-radius: 8px;

            margin-bottom: 15px;

            cursor: pointer;

        }

    </style>

</head>


<body>


    <div class="title">

        🎲 Yeketema Bingo

    </div>


    <!-- ==================================
         CARTELA SELECTION SCREEN
         ================================== -->

    <div id="cartela-screen">

        <div class="selection-title">

            🎫 Choose Your Cartela

        </div>


        <div
            id="cartela-grid"
            class="cartela-grid"
        >

        </div>

    </div>



    <!-- ==================================
         GAME SCREEN
         ================================== -->

    <div id="game-screen">


        <button
            class="back-button"
            onclick="backToCartelas()"
        >

            ← Change Cartela

        </button>


        <div
            id="selected-card-number"
            class="card-number"
        >

            Cartela --

        </div>


        <div class="drawn-container">

            <small
                style="color: #94a3b8;"
            >

                CURRENT NUMBER

            </small>


            <div id="drawn-box">

                --

            </div>

        </div>


        <div
            class="grid"
            id="bingo-grid"
        >

        </div>


        <button
            class="claim-button"
            onclick="claimBingo()"
        >

            Claim Bingo! 🏆

        </button>

    </div>



    <script>


        // =====================================
        // TELEGRAM
        // =====================================

        const tg =
            window.Telegram?.WebApp;


        if (tg) {

            tg.expand();

        }


        // =====================================
        // SOCKET.IO
        // =====================================

        const socket =
            io(
                "https://bingo-backend-7rt0.onrender.com"
            );


        // =====================================
        // PLAYER CARD
        // =====================================

        let myCard = [];

        let myCartelaNumber = null;



        // =====================================
        // SHOW CARTELA LIST
        // =====================================

        socket.on(
            "cartela_list",
            (data) => {

                showCartelaList(
                    data.cartelas
                );

            }
        );



        // =====================================
        // DISPLAY CARTELA BUTTONS
        // =====================================

        function showCartelaList(
            available
        ) {

            const container =
                document.getElementById(
                    "cartela-grid"
                );


            container.innerHTML = "";


            for (
                let i = 1;
                i <= 75;
                i++
            ) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.innerText =
                    i;


                button.className =
                    "cartela-button";


                if (
                    !available.includes(i)
                ) {

                    button.classList.add(
                        "unavailable"
                    );

                    button.disabled =
                        true;

                }

                else {

                    button.onclick =
                        () => {

                            selectCartela(i);

                        };

                }


                container.appendChild(
                    button
                );

            }

        }



        // =====================================
        // SELECT CARTELA
        // =====================================

        function selectCartela(number) {

            socket.emit(
                "select_cartela",
                number
            );

        }



        // =====================================
        // CARTELA SELECTED
        // =====================================

        socket.on(
            "cartela_selected",
            (data) => {

                myCartelaNumber =
                    data.number;

                myCard =
                    data.card;


                document.getElementById(
                    "selected-card-number"
                ).innerText =
                    "🎫 Cartela " +
                    myCartelaNumber;


                document.getElementById(
                    "cartela-screen"
                ).style.display =
                    "none";


                document.getElementById(
                    "game-screen"
                ).style.display =
                    "block";


                renderGrid();

            }
        );



        // =====================================
        // CARTELA AVAILABILITY
        // =====================================

        socket.on(
            "cartela_availability",
            (data) => {

                // Only update the selection
                // screen if we're looking at it.

                if (
                    document.getElementById(
                        "cartela-screen"
                    ).style.display !==
                    "none"
                ) {

                    showCartelaList(
                        data.available
                    );

                }

            }
        );



        // =====================================
        // CARTELA ERROR
        // =====================================

        socket.on(
            "cartela_error",
            (data) => {

                alert(
                    data.message
                );

            }
        );



        // =====================================
        // RENDER BINGO CARD
        // =====================================

        function renderGrid() {

            const grid =
                document.getElementById(
                    "bingo-grid"
                );


            grid.innerHTML = "";


            for (
                let row = 0;
                row < 5;
                row++
            ) {

                for (
                    let col = 0;
                    col < 5;
                    col++
                ) {

                    const number =
                        myCard[row][col];


                    const cell =
                        document.createElement(
                            "div"
                        );


                    if (number === 0) {

                        cell.className =
                            "cell star marked";

                        cell.innerText =
                            "★";

                    }

                    else {

                        cell.className =
                            "cell";

                        cell.innerText =
                            number < 10
                                ? "0" + number
                                : number;

                        cell.id =
                            "cell-" + number;

                    }


                    grid.appendChild(
                        cell
                    );

                }

            }

        }



        // =====================================
        // NUMBER DRAWN
        // =====================================

        socket.on(
            "number_drawn",
            (data) => {

                const number =
                    data.number;


                document.getElementById(
                    "drawn-box"
                ).innerText =
                    number < 10
                        ? "0" + number
                        : number;


                markNumber(
                    number
                );

            }
        );



        // =====================================
        // MARK NUMBER
        // =====================================

        function markNumber(number) {

            const cell =
                document.getElementById(
                    "cell-" + number
                );


            if (cell) {

                cell.classList.add(
                    "marked"
                );

            }

        }



        // =====================================
        // GAME STARTED
        // =====================================

        socket.on(
            "game_started",
            () => {

                console.log(
                    "🎱 Game started!"
                );

            }
        );



        // =====================================
        // GAME FINISHED
        // =====================================

        socket.on(
            "game_finished",
            () => {

                alert(
                    "🎱 All 75 numbers have been called."
                );

            }
        );



        // =====================================
        // BINGO RESULT
        // =====================================

        socket.on(
            "game_over",
            (data) => {

                if (
                    data.winner ===
                    socket.id
                ) {

                    if (data.fullCard) {

                        alert(
                            "🏆 BINGO!\n\n" +
                            "🎁 FULL CARTELA BONUS!"
                        );

                    }

                    else {

                        alert(
                            "🏆 BINGO!\n\n" +
                            "You completed 2 lines!"
                        );

                    }

                }

                else {

                    alert(
                        "🏆 GAME OVER!\n\n" +
                        "Another player won."
                    );

                }

            }
        );



        // =====================================
        // FALSE BINGO
        // =====================================

        socket.on(
            "false_alarm",
            (data) => {

                alert(
                    data.message
                );

            }
        );



        // =====================================
        // CLAIM BINGO
        // =====================================

        function claimBingo() {

            socket.emit(
                "claim_bingo"
            );

        }



        // =====================================
        // BACK TO CARTELA SELECTION
        // =====================================

        function backToCartelas() {

            document.getElementById(
                "game-screen"
            ).style.display =
                "none";


            document.getElementById(
                "cartela-screen"
            ).style.display =
                "block";


            socket.emit(
                "request_cartelas"
            );

        }

    </script>

</body>

</html>
